<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Addis Tech fabrication photo placeholder</title>
  <desc id="desc">Branded placeholder for a real Addis Tech fabrication photo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#164e63" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)" />
  <g fill="none" stroke="#99f6e4" stroke-opacity="0.14">
    <rect x="80" y="80" width="320" height="180" rx="24" />
    <rect x="520" y="130" width="520" height="120" rx="24" />
    <rect x="240" y="430" width="720" height="150" rx="28" />
  </g>
  <rect x="80" y="80" width="1040" height="560" rx="44" fill="url(#panel)" stroke="#00e0d1" stroke-opacity="0.3" />
  <text x="128" y="220" fill="#ecfeff" font-size="68" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Fabrication photo placeholder</text>
  <text x="128" y="310" fill="#ccfbf1" font-size="34" font-family="Segoe UI, Arial, sans-serif">Replace this with a real Addis Tech PCB fabrication or manufacturing photo.</text>
  <text x="128" y="402" fill="#67e8f9" font-size="26" font-family="Segoe UI, Arial, sans-serif">Suggested content: boards in production, tooling, inspection, or fabrication workflow.</text>
  <text x="128" y="540" fill="#f8fafc" font-size="22" font-family="Consolas, monospace">public/images/fabrication-floor.jpg</text>
</svg>