<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Addis Medical prototype placeholder</title>
  <desc id="desc">Branded placeholder for a real Addis Medical device photo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)" />
  <g fill="none" stroke="#bfdbfe" stroke-opacity="0.14">
    <rect x="130" y="140" width="260" height="420" rx="36" />
    <rect x="460" y="200" width="220" height="320" rx="28" />
    <rect x="760" y="150" width="280" height="400" rx="40" />
  </g>
  <rect x="80" y="80" width="1040" height="560" rx="44" fill="url(#panel)" stroke="#00e0d1" stroke-opacity="0.3" />
  <text x="128" y="220" fill="#eff6ff" font-size="68" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Addis Medical photo placeholder</text>
  <text x="128" y="310" fill="#dbeafe" font-size="34" font-family="Segoe UI, Arial, sans-serif">Replace this with a real Addis Medical device or prototype photo.</text>
  <text x="128" y="402" fill="#a5f3fc" font-size="26" font-family="Segoe UI, Arial, sans-serif">Suggested content: hearing aid, test rig, enclosure, or clinical device prototype.</text>
  <text x="128" y="540" fill="#f8fafc" font-size="22" font-family="Consolas, monospace">public/images/addis-medical-device.jpg</text>
</svg>