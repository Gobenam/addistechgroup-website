<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Addis Nano prototype placeholder</title>
  <desc id="desc">Branded placeholder for a real Addis Nano or Addis Tech prototype photo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#164e63" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)" />
  <g fill="none" stroke="#7dd3fc" stroke-opacity="0.16">
    <circle cx="230" cy="220" r="120" />
    <circle cx="930" cy="420" r="180" />
    <path d="M0 130h1200" />
    <path d="M0 590h1200" />
  </g>
  <rect x="80" y="80" width="1040" height="560" rx="44" fill="url(#panel)" stroke="#00e0d1" stroke-opacity="0.3" />
  <text x="128" y="220" fill="#eff6ff" font-size="68" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Addis Nano prototype placeholder</text>
  <text x="128" y="310" fill="#dbeafe" font-size="34" font-family="Segoe UI, Arial, sans-serif">Replace this with a real Addis Nano or Addis Tech IoT prototype photo.</text>
  <text x="128" y="402" fill="#a5f3fc" font-size="26" font-family="Segoe UI, Arial, sans-serif">Suggested content: sensor boards, packaged devices, or a live prototype demo.</text>
  <text x="128" y="540" fill="#f8fafc" font-size="22" font-family="Consolas, monospace">public/images/addis-nano-prototype.jpg</text>
</svg>